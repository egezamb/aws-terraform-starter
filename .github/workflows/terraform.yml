name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: results go to the job summary, so the workflow needs no write access to pull requests.
permissions:
  contents: read

jobs:
  terraform-check:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.5

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Summary
        if: always()
        run: |
          {
            echo "### Terraform CI"
            echo "- Format, init and validate: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  security-scan:
    name: Security scan (trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scanner is downloaded by version and checked against the release checksum.
      - name: Install trivy
        run: |
          curl -sSLo trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
      # Accepted findings carry a trivy:ignore comment with the reason, on the resource itself.
      - run: ./trivy config --skip-check-update --severity HIGH,CRITICAL --exit-code 1 .
